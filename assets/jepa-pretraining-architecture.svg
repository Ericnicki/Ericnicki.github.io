<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Cross-modal JEPA pretraining</title><desc id="desc">An online sensor encoder predicts a stopped EMA landmark target. An online landmark encoder predicts a stopped EMA sensor target. The loss combines forward regression, one-quarter reverse regression and SIGReg; targets track their corresponding online encoders with EMA.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#123f75" stroke-width="1.5"/></marker></defs><rect width="1120" height="650" fill="white"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#d96c24" text-anchor="start">02 / REPRESENTATION PRETRAINING</text><text x="32" y="71" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Learn landmark targets that sensors can predict</text><text x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Inverse prediction shapes landmark features; forward prediction teaches the sensor encoder to match them.</text><text x="32" y="144" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#123f75" text-anchor="start">RADAR + IMU → LANDMARK REPRESENTATION</text><rect x="32" y="164" width="240" height="103" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="193" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Online sensor encoder</text><text x="48" y="219" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Radar + IMU fusion</text><text x="48" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">128D sensor token</text><path d="M272 215 L309 215" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="164" width="235" height="103" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="332" y="193" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Latent predictor</text><text x="332" y="219" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">LN → 128 → 256 → 128</text><text x="332" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">GELU</text><path d="M551 215 L658 215" fill="none" stroke="#123f75" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="601" y="205" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">match</text><rect x="665" y="164" width="264" height="103" rx="12" fill="#fff2e6" stroke="#ecc8aa"/><text x="681" y="193" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">EMA landmark target</text><text x="681" y="219" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Landmarks → 128D</text><text x="681" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Stop gradient</text><text x="953" y="207" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#123f75" text-anchor="start">Weight 1.00</text><text x="32" y="310" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#123f75" text-anchor="start">LANDMARKS → SENSOR REPRESENTATION</text><rect x="32" y="330" width="240" height="103" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="359" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Online landmark encoder</text><text x="48" y="385" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">263D features → 256 → 128</text><text x="48" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">GELU + LayerNorm</text><path d="M272 381 L309 381" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="330" width="235" height="103" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="332" y="359" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Latent predictor</text><text x="332" y="385" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">LN → 128 → 256 → 128</text><text x="332" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">GELU</text><path d="M551 381 L658 381" fill="none" stroke="#123f75" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="601" y="371" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">match</text><rect x="665" y="330" width="264" height="103" rx="12" fill="#fff2e6" stroke="#ecc8aa"/><text x="681" y="359" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">EMA sensor target</text><text x="681" y="385" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Radar + IMU → 128D</text><text x="681" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Stop gradient</text><text x="953" y="373" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#123f75" text-anchor="start">Weight 0.25</text><rect x="32" y="468" width="1055" height="143" rx="12" fill="#f7f9fc" stroke="#d9e0e8"/><text x="54" y="501" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#123f75" text-anchor="start">L = Lsensor→landmark + 0.25 Llandmark→sensor + 0.05 LSIGReg</text><text x="54" y="531" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">SIGReg regularizes both online representations. EMA momentum follows a cosine schedule from 0.996 toward 1.</text><text x="54" y="558" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Landmark features: centered joints, articulation changes, wrist velocity, inter-hand displacement, and validity.</text><text x="54" y="585" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Landmark features include adjacent-frame differences; the learned encoders and predictors operate frame by frame.</text></svg>