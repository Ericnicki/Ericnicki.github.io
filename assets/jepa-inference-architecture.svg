<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Gesture classification with frozen JEPA features</title><desc id="desc">Thirty radar-IMU sensor tokens from the frozen pretrained encoder are combined with a class token and learned position embeddings. A two-layer eight-head Transformer with feed-forward width 512 classifies eight gestures; landmarks are not loaded at inference.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#123f75" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" fill="white"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#d96c24" text-anchor="start">03 / GESTURE CLASSIFICATION</text><text x="32" y="71" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Learn the representation first. Train the classifier second.</text><text x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Gesture labels train the temporal classifier; gradients do not update the pretrained sensor encoder.</text><rect x="32" y="157" width="220" height="113" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="186" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Radar + IMU sequence</text><text x="48" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">30 synchronous frames</text><text x="48" y="233" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">No landmarks loaded</text><path d="M252 214 L280 214" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="288" y="157" width="225" height="113" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="304" y="186" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Frozen sensor encoder</text><text x="304" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Framewise fusion</text><text x="304" y="233" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">30 × 128D features</text><path d="M513 214 L542 214" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="157" width="300" height="113" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="566" y="186" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Temporal Transformer</text><text x="566" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">[CLS] + learned positions</text><text x="566" y="233" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">2 layers · 8 heads · FFN 512</text><path d="M850 214 L880 214" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="888" y="157" width="200" height="113" rx="12" fill="#fff2e6" stroke="#ecc8aa"/><text x="904" y="186" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">Gesture prediction</text><text x="904" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">[CLS] → Linear 128 → 8</text><text x="904" y="233" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Eight gesture classes</text><rect x="32" y="310" width="1056" height="77" rx="12" fill="#fffaf5" stroke="#ecd8c5"/><text x="54" y="341" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">Deployment inputs: radar + IMU only</text><text x="54" y="366" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Landmark encoders, EMA targets and cross-modal predictors belong to representation pretraining.</text></svg>