<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 655" role="img" aria-labelledby="title desc"><title id="title">Joint TTT memory RL architecture</title><desc id="desc">Observed state and action history feed an eight-block causal TTT context network and a separately adapted physical memory. The context actor supplies anchor acceleration and a correction actor reads a normalized 22-dimensional memory belief. Their combined bounded action is executed; only observed transitions update fast physical memory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#123f75" stroke-width="1.5"/></marker></defs><rect width="1120" height="655" fill="white"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#d96c24" text-anchor="start">MEMORY-BASED RL / EXECUTION</text><text x="32" y="71" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">Two memories, updated from actual interaction</text><text x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Global network weights stay fixed during evaluation. Task-private memory persists across physical trial resets.</text><rect x="32" y="156" width="230" height="120" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="185" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Observed interaction</text><text x="48" y="211" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Current state: 22D</text><text x="48" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Past observations + actions</text><path d="M262 197 L300 197" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="309" y="147" width="300" height="125" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="325" y="176" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Causal TTT context</text><text x="325" y="202" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">8 residual TTT / MLP blocks</text><text x="325" y="223" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">16-frame factual windows</text><text x="325" y="244" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">32D context</text><path d="M609 202 L658 202" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="667" y="155" width="247" height="110" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="683" y="184" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Anchor actor</text><text x="683" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">State + context → MLP</text><text x="683" y="231" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Baseline acceleration</text><path d="M262 238 H282 V396 H309" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="309" y="338" width="300" height="124" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="325" y="367" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Physical fast memory</text><text x="325" y="393" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Task-private W: 32 × 22</text><text x="325" y="414" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Writes after executed blocks</text><text x="325" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Measured successor as target</text><path d="M609 398 L658 398" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="667" y="338" width="247" height="124" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="683" y="367" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Correction actor</text><text x="683" y="393" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">22D normalized memory belief</text><text x="683" y="414" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">State + context + belief → MLP</text><text x="683" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Bounded correction: ±0.05 m/s²</text><path d="M914 210 H952 V286 H976" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><path d="M914 397 H952 V331 H976" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="984" y="259" width="105" height="103" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="1000" y="288" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Control</text><text x="1000" y="314" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Combine</text><text x="1000" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Bound</text><text x="1000" y="356" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Execute</text><path d="M1036 363 V506 H148 V282" fill="none" stroke="#123f75" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="450" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Observed outcome → next memory update</text><rect x="32" y="546" width="1056" height="73" rx="12" fill="#fffaf5" stroke="#ecd8c5"/><text x="54" y="576" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">Real transitions supply adaptation evidence</text><text x="54" y="600" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Candidate predictions do not write memory. Sparse terminal return supervises slow value learning during training.</text></svg>