<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Radar and IMU frame encoder</title><desc id="desc">Synchronous radar and IMU frames are independently encoded, fused through concatenation, product and difference, and projected to a 128-dimensional sensor token. The same encoder is shared across thirty frames.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#123f75" stroke-width="1.5"/></marker></defs><rect width="1120" height="600" fill="white"/><text x="32" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#d96c24" text-anchor="start">01 / SENSOR ENCODER</text><text x="32" y="71" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">One sensor token per synchronous frame</text><text x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Shared weights across 30 frames · both radar and IMU are required</text><rect x="32" y="150" width="175" height="100" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="179" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Radar frame</text><text x="48" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Single-channel map</text><text x="48" y="226" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Normalized log(1+x)</text><path d="M207 200 L242 200" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="247" y="150" width="235" height="100" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="263" y="179" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">ResNet-18</text><text x="263" y="205" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">1-channel input convolution</text><text x="263" y="226" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">512D → Linear + LN → 128D</text><rect x="32" y="312" width="175" height="100" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="48" y="341" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">IMU sample</text><text x="48" y="367" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">6 normalized channels</text><text x="48" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Aligned with radar</text><path d="M207 362 L242 362" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="247" y="312" width="235" height="100" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="263" y="341" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">IMU MLP</text><text x="263" y="367" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">LayerNorm → 6 → 128 → 128</text><text x="263" y="388" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">GELU + LayerNorm</text><path d="M482 200 H520 V258 H552" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><path d="M482 362 H520 V324 H552" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="558" y="223" width="250" height="135" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="574" y="252" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Cross-modal fusion</text><text x="574" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Concatenate [r, i, r ⊙ i, r − i]</text><text x="574" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">512D → 256D → 128D</text><text x="574" y="320" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">GELU + LayerNorm</text><path d="M808 290 L845 290" fill="none" stroke="#123f75" stroke-width="2" marker-end="url(#arrow)"/><rect x="852" y="240" width="235" height="100" rx="12" fill="#edf3fa" stroke="#bdcfe3"/><text x="868" y="269" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#123f75" text-anchor="start">Sensor token</text><text x="868" y="295" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">128 dimensions / frame</text><text x="868" y="316" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">30 × 128 tokens / episode</text><rect x="32" y="463" width="1055" height="95" rx="12" fill="#fffaf5" stroke="#ecd8c5"/><text x="54" y="496" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#d96c24" text-anchor="start">No learned temporal attention in this encoder</text><text x="54" y="525" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">The temporal Transformer comes later, after representation pretraining, when the sensor encoder is frozen.</text></svg>